name: Weekly Shelf Healthcheck

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

jobs:
  check-links:
    name: Verify URLs and Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Schema and Structure
        run: npx tsx scripts/validate-shelf.ts

      - name: Ping and Validate Live Endpoints
        run: npx tsx scripts/check-links.ts
