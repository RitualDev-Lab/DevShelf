name: Nightly Performance Benchmarking

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 2:00 AM UTC
  workflow_dispatch:

permissions: read-all

jobs:
  benchmark:
    name: Measure TTFB Latency & Audit Sluggish APIs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Performance Benchmark
        run: npx tsx scripts/benchmark-performance.ts

      - name: Commit Updated Latency Benchmarks
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          git add shelf/ site/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(benchmark): update nightly latency metrics & performance warnings [skip ci]"
            git push origin main
          fi
