name: Nightly Performance Benchmarking

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 2:00 AM UTC
  workflow_dispatch:

permissions: read-all

jobs:
  benchmark:
    name: Measure TTFB Latency & Audit Sluggish APIs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Performance Benchmark
        run: npx tsx scripts/benchmark-performance.ts

      - name: Commit Updated Latency Benchmarks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          git add shelf/ site/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(benchmark): update nightly latency metrics & performance warnings"
            git push origin main || (
              BRANCH="telemetry/benchmark-$(date +%Y%m%d%H%M)"
              git checkout -b "$BRANCH"
              git push origin "$BRANCH" --force
              gh pr create --title "chore(benchmark): update nightly latency metrics" --body "Nightly benchmark updates by DevShelf Bot." --head "$BRANCH" --base main
            )
          fi
