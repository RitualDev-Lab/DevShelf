name: Auto Process Community Submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process-submission:
    name: Validate and Add to Shelf
    if: contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[Submit Project]') || startsWith(github.event.issue.title, '[Submit API]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Process Issue Form Data
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          npx tsx scripts/process-submission.ts

      - name: Rebuild README & Web Directory Data
        run: |
          pnpm run build
          pnpm run format

      - name: Commit and Push to Main
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          git add shelf/ README.md site/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(community): add submission from issue #${{ github.event.issue.number }} [skip ci]"
            git push origin main
          fi

      - name: Post Confirmation & Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `🎉 **Congratulations @${context.payload.issue.user.login}!**

Your submission has been verified and is now live on [DevShelf](https://github.com/RitualDev-Lab/DevShelf) and the [Interactive Web App](https://ritualdev-lab.github.io/DevShelf)!

---

### 🎖️ Display the "Featured on DevShelf" Badge on Your README

If you'd like to show it off on your README, pick whichever style fits your project:

#### Option 1: Modern Electric Violet
[![Featured on DevShelf](https://img.shields.io/badge/Featured_on-DevShelf-8B5CF6?style=for-the-badge&logo=compass&logoColor=06B6D4&labelColor=0B0F19)](https://ritualdev-lab.github.io/DevShelf/)

\`\`\`markdown
[![Featured on DevShelf](https://img.shields.io/badge/Featured_on-DevShelf-8B5CF6?style=for-the-badge&logo=compass&logoColor=06B6D4&labelColor=0B0F19)](https://ritualdev-lab.github.io/DevShelf/)
\`\`\`

#### Option 2: Terminal Emerald
[![DevShelf Verified](https://img.shields.io/badge/DevShelf-100%25_Verified_FOSS-10B981?style=for-the-badge&logo=gnubash&logoColor=white&labelColor=111827)](https://ritualdev-lab.github.io/DevShelf/)

\`\`\`markdown
[![DevShelf Verified](https://img.shields.io/badge/DevShelf-100%25_Verified_FOSS-10B981?style=for-the-badge&logo=gnubash&logoColor=white&labelColor=111827)](https://ritualdev-lab.github.io/DevShelf/)
\`\`\`

#### Option 3: Minimal Dark Pill
[![Featured on DevShelf](https://img.shields.io/badge/📚_Featured_on-DevShelf-6366F1?style=flat&labelColor=1E1E2E&color=A855F7)](https://ritualdev-lab.github.io/DevShelf/)

\`\`\`markdown
[![Featured on DevShelf](https://img.shields.io/badge/📚_Featured_on-DevShelf-6366F1?style=flat&labelColor=1E1E2E&color=A855F7)](https://ritualdev-lab.github.io/DevShelf/)
\`\`\`

Thank you for contributing to the open-source community! ⭐`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
