name: 🛡️ Automated Link Rot, License & Paywall Sentinel

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit items scanned (empty for all)'
        required: false
        default: ''

permissions: read-all

concurrency:
  group: sentinel-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Run Sentinel Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Sentinel Auditor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="--limit=${{ github.event.inputs.limit }}"
          fi
          npx tsx scripts/sentinel-auditor.ts $ARGS

      - name: Commit Fresh Sentinel Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          if [ -f site/sentinel-report.json ]; then
            git add site/sentinel-report.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(sentinel): update weekly health, license & paywall audit report"
              git push origin main || (
                BRANCH="telemetry/sentinel-$(date +%Y%m%d%H%M)"
                git checkout -b "$BRANCH"
                git push origin "$BRANCH" --force
                gh pr create --title "chore(sentinel): update weekly health audit report" --body "Automated Sentinel telemetry update." --head "$BRANCH" --base main
              )
            fi
          fi
