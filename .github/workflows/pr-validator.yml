name: PR Schema & Duplicate Validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    name: Validate Schema & Check Duplicates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Schema Validator & Duplicate Detector
        id: validator
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/validate-pr.ts

      - name: Check Validation Report
        id: report
        if: always()
        run: |
          if [ -f .pr-validation-report.md ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or Update PR Review Comment
        if: always() && steps.report.outputs.has_report == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('.pr-validation-report.md')) return;
            const reportContent = fs.readFileSync('.pr-validation-report.md', 'utf8');

            const issueNumber = context.payload.pull_request?.number;
            if (!issueNumber) return;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('DevShelf PR Validation Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: reportContent,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: reportContent,
              });
            }

      - name: Enforce Validation Gate
        if: steps.validator.outcome == 'failure'
        run: |
          echo "❌ PR schema validation or duplicate check failed. See the automated comment above."
          exit 1
