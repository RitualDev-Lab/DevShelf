name: PR Schema, Duplicate & AI Optimization Validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: read-all

jobs:
  validate-pr:
    name: PR Integrity Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Automated Test Suite
        run: pnpm test

      - name: Run Schema Validator & Duplicate Detector
        id: validator
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/validate-pr.ts

      - name: Run URL Sanitizer & Duplicate Audit
        id: link_sanitizer
        continue-on-error: true
        run: node scripts/validate-links.js

      - name: Run AI-Driven PR Optimization & Tagging
        id: ai_optimizer
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/ai-optimize-pr.ts

      - name: Check Validation & AI Reports
        id: report
        if: always()
        run: |
          if [ -f .pr-validation-report.md ] || [ -f .ai-pr-optimization.md ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or Update PR Review Comment
        if: always() && steps.report.outputs.has_report == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              const fs = require('node:fs');
              let combinedReport = "";

              if (fs.existsSync('.pr-validation-report.md')) {
                combinedReport += fs.readFileSync('.pr-validation-report.md', 'utf8') + "\n\n";
              }
              if (fs.existsSync('.ai-pr-optimization.md')) {
                combinedReport += fs.readFileSync('.ai-pr-optimization.md', 'utf8');
              }

              if (!combinedReport.trim()) return;

              const issueNumber = context.payload.pull_request?.number;
              if (!issueNumber) return;

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const botComment = comments.data.find(c =>
                c.user.type === 'Bot' && c.body.includes('DevShelf PR Validation Report')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: combinedReport,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: combinedReport,
                });
              }
            } catch (error) {
              console.warn("⚠️ Unable to post or update PR review comment (insufficient fork permissions):", error.message);
            }

      - name: Enforce Validation Gate
        if: steps.validator.outcome == 'failure'
        run: |
          echo "❌ PR schema validation or duplicate check failed. See the automated review comment above."
          exit 1
