name: 🤝 Sync Contributor Matchmaker Issues

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6:00 AM UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: sync-matchmaker
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Live Good First Issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Matchmaker Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/sync-good-first-issues.ts

      - name: Commit & Push Updated Matchmaker Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          git add site/matchmaker.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(matchmaker): sync live good first issues [skip ci]"
            git push origin main || (
              BRANCH="telemetry/matchmaker-$(date +%Y%m%d%H%M)"
              git checkout -b "$BRANCH"
              git push origin "$BRANCH" --force
              gh pr create --title "chore(matchmaker): sync live good first issues" --body "Matchmaker issue sync by DevShelf Bot." --head "$BRANCH" --base main
            )
          else
            echo "No changes in matchmaker issues."
          fi
