name: 🚀 On Merge Contributor Celebration & Badge Delivery

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions: read-all

jobs:
  celebrate:
    name: Celebrate Submission Merge & Send Badge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post Celebration & Delivery Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const postMergeCelebration = require('./scripts/post-merge-celebration.cjs');
            await postMergeCelebration({ github, context });
