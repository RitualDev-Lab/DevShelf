name: Weekly Trial Bait & Paywall Trap Auditor

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum resources to audit (leave empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run mode (do not file GitHub issues)'
        type: boolean
        required: false
        default: false

permissions: read-all

jobs:
  audit-trial-bait:
    name: Scan for Free Tier Degradations & Upfront Paywalls
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Trial Bait & Paywall Trap Auditor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/audit-trial-bait.ts $ARGS

      - name: Commit Fresh Trial Bait Audit Report to Main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          if [ -f site/trial-bait-report.json ]; then
            git add site/trial-bait-report.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(audit): update trial-bait telemetry report [skip ci]"
              git push origin main || (
                BRANCH="telemetry/trial-bait-$(date +%Y%m%d%H%M)"
                git checkout -b "$BRANCH"
                git push origin "$BRANCH" --force
                gh pr create --title "chore(audit): update trial-bait telemetry report" --body "Trial bait telemetry report update by DevShelf Bot." --head "$BRANCH" --base main
              )
            fi
          fi
