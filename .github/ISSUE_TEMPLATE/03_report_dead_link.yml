name: ?? Report a Dead or Broken Link
description: Notify maintainers about an unreachable endpoint, 404, or moved resource
title: "[Broken Link]: <Resource Name>"
labels: ["bug", "broken-link"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep DevShelf 100% active and healthy!  
        Our automated link checker pings endpoints weekly, but if you found a broken link first, let us know.
  - type: input
    id: resource_name
    attributes:
      label: Resource Name
      placeholder: e.g. 1Password for Open Source
    validations:
      required: true
  - type: input
    id: broken_url
    attributes:
      label: Current URL in DevShelf
      placeholder: https://example.com/dead-link
    validations:
      required: true
  - type: dropdown
    id: error_type
    attributes:
      label: Error Observed
      options:
        - 404 Not Found
        - DNS / Domain Expired
        - Connection Timed Out
        - Requires Paid Plan / Expired Free Tier
        - Other
    validations:
      required: true
  - type: input
    id: suggested_fix
    attributes:
      label: Replacement URL (if known)
      placeholder: https://example.com/new-working-url
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Additional Notes
      placeholder: Any context on when or how this link failed.
