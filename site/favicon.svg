<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas with Glow Border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#accent-grad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Stylized Bookshelf / Terminal Prompt Icon -->
  <g filter="url(#glow)">
    <!-- Book/Layer 1 (Left spine) -->
    <rect x="14" y="18" width="8" height="28" rx="2" fill="url(#accent-grad)" />
    <!-- Book/Layer 2 (Middle tilted book) -->
    <rect x="25" y="15" width="8" height="31" rx="2" fill="#8b5cf6" />
    <!-- Book/Layer 3 (Right book) -->
    <rect x="36" y="22" width="8" height="24" rx="2" fill="url(#cyan-glow)" />
    <!-- Glowing Shelf Base / Terminal Cursor -->
    <rect x="12" y="47" width="40" height="4" rx="2" fill="url(#cyan-glow)" />
    <!-- Subtle Code Prompt ">" Overlay on Shelf -->
    <path d="M47 18 L51 22 L47 26" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
