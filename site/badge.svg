<svg xmlns="http://www.w3.org/2000/svg" width="168" height="24" viewBox="0 0 168 24">
  <defs>
    <linearGradient id="purple-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <clipPath id="rounded">
    <rect width="168" height="24" rx="4" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#rounded)">
    <rect width="66" height="24" fill="#18181b"/>
    <rect x="66" width="102" height="24" fill="url(#purple-bg)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <!-- DevShelf label -->
    <text x="33" y="16" fill="#fff" letter-spacing="0.2">DevShelf</text>
    <!-- Verified Free label -->
    <text x="117" y="16" fill="#fff" font-weight="700" letter-spacing="0.3">Verified Free</text>
  </g>
  <!-- Verified check icon -->
  <path d="M72 12.5 L75 15.5 L80 9.5" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
